# Servidor que entrega los archivos estáticos generados por React en producción.
server {
  # Nginx escucha el puerto HTTP estándar dentro del contenedor.
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Endpoint liviano usado por Docker para comprobar que Nginx responde.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # En producción el navegador usa el mismo origen; FastAPI no se publica
  # directamente y las cookies seguras conservan un único dominio.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Si una ruta no corresponde a un archivo, devuelve index.html.
  # Esto permite que una SPA gestione sus propias rutas en el navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los recursos con nombre versionado pueden guardarse siete días en caché.
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
