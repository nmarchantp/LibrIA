name: libria

x-backend: &backend
  build:
    context: ./apps/backend
  env_file:
    - ./apps/backend/.env
  environment:
    DATABASE_URL: postgresql+psycopg://libria:${POSTGRES_PASSWORD:-libria-dev-only}@db:5432/libria
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: libria
      POSTGRES_USER: libria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libria-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libria -d libria"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "scripts.migrate_and_seed"]
    profiles: ["migration"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  schema-check:
    <<: *backend
    command: ["python", "-m", "alembic", "current", "--check-heads"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      schema-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *backend
    command: ["python", "-m", "scripts.run_scheduler"]
    depends_on:
      schema-check:
        condition: service_completed_successfully

  gemini-worker:
    <<: *backend
    command: ["python", "-m", "scripts.run_gemini_worker"]
    profiles: ["gemini"]
    depends_on:
      schema-check:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      target: production
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
