# Nombre común con el que Docker agrupa los recursos de desarrollo.
name: libria

services:
  # Frontend React ejecutado con el servidor de desarrollo de Vite.
  web:
    build:
      # La imagen se construye usando únicamente los archivos del frontend.
      context: ./apps/web
      dockerfile: Dockerfile
      # Selecciona la etapa de desarrollo definida dentro del Dockerfile.
      target: development
    ports:
      # Permite cambiar el puerto del computador mediante WEB_PORT en .env.
      - "${WEB_PORT:-5173}:5173"
    environment:
      # El sondeo de archivos hace confiable la recarga automática en Windows.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Comparte el código local con el contenedor para ver cambios al guardar.
      - ./apps/web:/app
      # Mantiene las dependencias Linux separadas de las instaladas en Windows.
      - web_node_modules:/app/node_modules
    healthcheck:
      # Docker consulta Vite periódicamente para informar si el servicio está sano.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  # Volumen administrado por Docker; es regenerable con npm ci.
  web_node_modules:
