<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bordes ilustrados de los 24 temas</title>
<style>body{margin:24px;background:#181721;color:#F6F0FC;font:15px/1.6 system-ui}label{display:inline-block;margin:0 20px 18px 0}select{font:inherit;padding:8px;max-width:100%}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,390px);gap:20px;align-items:start}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border:1px solid #666271}figcaption{margin-bottom:8px}@media(max-width:900px){.comparison{grid-template-columns:1fr}}</style>
<h1>Bordes ilustrados de los 24 temas</h1><p>Un borde inferior fino y un detalle a la derecha para cada universo. Capturas reales con datos simulados. <a style="color:#C2A4F3" href="../artifacts/theme-footers/contact-sheet.png">Ver las 24 ilustraciones juntas</a>.</p>
<label>Tema <select id="theme"><option value="dark">Reino de Sombras</option><option value="lavanda">Jardín de Macarons</option><option value="otono">Tintas del Equinoccio</option><option value="invierno">Alas de Cristal</option><option value="rosa-antiguo">Algodón de azúcar</option><option value="bosque">Bosque feérico</option><option value="dark-dorado">Biblioteca de Medianoche</option><option value="dark-blood">Pacto de Sangre</option><option value="dark-rosado">Rosas y Espinas</option><option value="cronicas-tiempo">Crónicas del Tiempo</option><option value="reino-celestial">Reino Celestial</option><option value="arenas-destino">Arenas del Destino</option><option value="susurros-sakura">Susurros de Sakura</option><option value="archivo-galactico">Archivo Galáctico</option><option value="olimpo-eterno">Olimpo Eterno</option><option value="otono-encantado">Otoño Encantado</option><option value="oraculo-luna">Oráculo de la Luna</option><option value="runas-norte">Runas del Norte</option><option value="reino-hongos">Reino de los Hongos</option><option value="catedral-cristal">Catedral de Cristal</option><option value="mil-una-historias">Las Mil y Una Historias</option><option value="canto-sirenas">Canto de Sirenas</option><option value="ecos-sombras">Ecos de las Sombras</option><option value="aquelarre-medianoche">Aquelarre de Medianoche</option></select></label>
<div class="comparison"><figure><figcaption>Escritorio — 1440 × 1000</figcaption><img id="desktop" alt="Vista de escritorio del tema seleccionado"></figure><figure><figcaption>Celular — 390 × 844</figcaption><img id="phone" alt="Vista de celular del tema seleccionado"></figure></div>
<script>const theme=document.getElementById('theme');function update(){for(const [id,width]of[['desktop',1440],['phone',390]])document.getElementById(id).src='../artifacts/theme-footers/'+theme.value+'-'+width+'-mural.png'}theme.addEventListener('change',update);update()</script></html>
