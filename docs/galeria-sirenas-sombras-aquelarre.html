<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tres universos ilustrados</title>
<style>body{margin:24px;background:#171020;color:#F7EEFC;font:15px/1.6 system-ui}label{display:inline-block;margin:0 20px 18px 0}select{font:inherit;padding:8px;max-width:100%}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,390px);gap:20px;align-items:start}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border:1px solid #493052}figcaption{margin-bottom:8px}@media(max-width:900px){.comparison{grid-template-columns:1fr}}</style>
<h1>Canto de Sirenas · Ecos de las Sombras · Aquelarre de Medianoche</h1><p>Recursos definitivos integrados. Capturas reales con datos simulados.</p>
<label>Tema <select id="theme"><option value="canto-sirenas">Canto de Sirenas</option><option value="ecos-sombras">Ecos de las Sombras</option><option value="aquelarre-medianoche">Aquelarre de Medianoche</option></select></label>
<label>Página <select id="page"><option value="mural">Mural</option><option value="profile">Mi perfil</option><option value="profile-tab-library">Biblioteca</option><option value="readingbook-fixture">Lectura</option><option value="books-q-Historias">Explorar libros</option><option value="events">Eventos</option><option value="recommendations">Recomendaciones IA</option><option value="settings">Configuración</option><option value="adminprofiles">Administración</option></select></label>
<div class="comparison"><figure><figcaption>Escritorio — 1440 × 1000</figcaption><img id="desktop" alt="Vista de escritorio del tema seleccionado"></figure><figure><figcaption>Celular — 390 × 844</figcaption><img id="phone" alt="Vista de celular del tema seleccionado"></figure></div>
<script>const theme=document.getElementById('theme'),page=document.getElementById('page');function update(){for(const [id,width]of[['desktop',1440],['phone',390]])document.getElementById(id).src=`../artifacts/three-themes-illustrated/${theme.value}-${width}-${page.value}.png`}theme.addEventListener('change',update);page.addEventListener('change',update);update()</script></html>
