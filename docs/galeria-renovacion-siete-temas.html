<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renovación de siete temas</title>
<style>body{margin:24px;background:#181721;color:#F6F0FC;font:15px/1.6 system-ui}label{display:inline-block;margin:0 20px 18px 0}select{font:inherit;padding:8px;max-width:100%}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,390px);gap:20px;align-items:start}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border:1px solid #666271}figcaption{margin-bottom:8px}@media(max-width:900px){.comparison{grid-template-columns:1fr}}</style>
<h1>Renovación de siete universos literarios</h1><p>21 ilustraciones nuevas. Capturas reales con datos simulados.</p>
<label>Tema <select id="theme"><option value="lavanda">Jardín de Macarons</option><option value="dark">Reino de Sombras</option><option value="otono">Tintas del Equinoccio</option><option value="invierno">Alas de Cristal</option><option value="rosa-antiguo">Algodón de azúcar</option><option value="bosque">Bosque feérico</option><option value="dark-dorado">Biblioteca de Medianoche</option></select></label>
<label>Página <select id="page"><option value="mural">Mural</option><option value="profile">Mi perfil</option><option value="profile-tab-library">Biblioteca</option><option value="readingbook-fixture">Lectura</option><option value="books-q-Historias">Explorar libros</option><option value="events">Eventos</option><option value="recommendations">Recomendaciones IA</option><option value="settings">Configuración</option><option value="adminprofiles">Administración</option></select></label>
<div class="comparison"><figure><figcaption>Escritorio — 1440 × 1000</figcaption><img id="desktop" alt="Vista de escritorio del tema seleccionado"></figure><figure><figcaption>Celular — 390 × 844</figcaption><img id="phone" alt="Vista de celular del tema seleccionado"></figure></div>
<script>const theme=document.getElementById('theme'),page=document.getElementById('page');function update(){for(const [id,width]of[['desktop',1440],['phone',390]])document.getElementById(id).src=`../artifacts/seven-theme-refresh/${theme.value}-${width}-${page.value}.png`}theme.addEventListener('change',update);page.addEventListener('change',update);update()</script></html>
